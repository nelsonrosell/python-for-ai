name: Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Run tests
        run: python -m pytest

  container-deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    env:
      AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      CONTAINER_REGISTRY_LOGIN_SERVER: ${{ vars.CONTAINER_REGISTRY_LOGIN_SERVER }}
      CONTAINER_IMAGE_NAME: ${{ vars.CONTAINER_IMAGE_NAME || 'python-for-ai' }}
      CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image tag
        id: image-tag
        run: |
          echo "image=${CONTAINER_REGISTRY_LOGIN_SERVER}/${CONTAINER_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate deployment configuration
        id: validate
        run: |
          if [ -z "${AZURE_WEBAPP_NAME}" ] || [ -z "${AZURE_WEBAPP_PUBLISH_PROFILE}" ] || [ -z "${CONTAINER_REGISTRY_LOGIN_SERVER}" ] || [ -z "${CONTAINER_REGISTRY_USERNAME}" ] || [ -z "${CONTAINER_REGISTRY_PASSWORD}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Container deployment skipped. Configure AZURE_WEBAPP_NAME, AZURE_WEBAPP_PUBLISH_PROFILE, CONTAINER_REGISTRY_LOGIN_SERVER, CONTAINER_REGISTRY_USERNAME, and CONTAINER_REGISTRY_PASSWORD to enable CD."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to container registry
        if: steps.validate.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY_LOGIN_SERVER }}
          username: ${{ env.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ env.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and push image
        if: steps.validate.outputs.ready == 'true'
        run: |
          docker build -t "${{ steps.image-tag.outputs.image }}" .
          docker push "${{ steps.image-tag.outputs.image }}"

      - name: Deploy container to Azure Web App
        if: steps.validate.outputs.ready == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ steps.image-tag.outputs.image }}
